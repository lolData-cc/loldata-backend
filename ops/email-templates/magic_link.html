<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>Your sign-in link</title>
</head>
<body style="margin:0;padding:0;background:#040A0C;" bgcolor="#040A0C">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#040A0C" style="background:#040A0C;border-collapse:collapse;">
    <tr>
      <td align="center" style="padding:40px 16px 48px 16px;">
        <table role="presentation" width="520" cellpadding="0" cellspacing="0" border="0" style="width:520px;max-width:100%;border-collapse:collapse;">

          <!-- wordmark -->
          <tr>
            <td align="left" style="padding:0 0 22px 4px;font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:15px;letter-spacing:0.28em;color:#6b7572;">
              lol<span style="color:#00d992;">&#9672;</span><span style="color:#d7d8d9;font-weight:700;">data</span>
            </td>
          </tr>

          <!-- plate -->
          <tr>
            <td bgcolor="#050d10" style="background:#050d10;border:1px solid #0d2b25;border-top:1px solid #00d992;border-radius:3px;padding:34px 36px 20px 36px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">

                <tr>
                  <td style="padding:0 0 10px 0;font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:10px;line-height:14px;letter-spacing:0.2em;color:#00d992;text-transform:uppercase;">
                    &#9672;&nbsp; Sign in
                  </td>
                </tr>
                <tr>
                  <td style="padding:0 0 6px 0;font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:24px;line-height:30px;color:#d7d8d9;font-weight:700;">
                    Your sign-in link
                  </td>
                </tr>
                <tr>
                  <td style="padding:0 0 22px 0;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;"><tr><td width="64" height="1" bgcolor="#00d992" style="background:#00d992;font-size:0;line-height:0;">&nbsp;</td></tr></table>
                  </td>
                </tr>
                <tr>
                  <td style="padding:0 0 22px 0;font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:13px;line-height:21px;color:#9aa5a1;">
                    Press the button to sign in to lolData, or enter the code on the page you came from.
                  </td>
                </tr>

              <tr>
                <td align="center" style="padding:6px 0 26px 0;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                    <tr>
                      <td align="center" bgcolor="#071a16" style="background:#071a16;border:1px solid #0f3a30;border-radius:3px;">
                        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 34px;font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:12px;line-height:16px;letter-spacing:0.18em;color:#00d992;text-decoration:none;text-transform:uppercase;font-weight:700;">&#9672;&nbsp; Sign in</a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td align="center" style="padding:6px 0 26px 0;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                    <tr>
                      <td align="center" bgcolor="#071a16" style="background:#071a16;border:1px solid #0f3a30;border-radius:3px;padding:18px 34px;">
                        <span style="font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:34px;line-height:40px;letter-spacing:0.34em;color:#00d992;font-weight:700;">{{ .Token }}</span>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
                <tr>
                  <td style="padding:0 0 22px 0;font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:11px;line-height:18px;color:#5a6a66;">
                    Valid for 24 hours. If you didn&#8217;t request this, ignore this email.
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- footer -->
          <tr>
            <td align="left" style="padding:18px 4px 0 4px;font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:10px;line-height:16px;letter-spacing:0.08em;color:#3f4a47;">
              lolData &middot; <a href="https://loldata.cc" style="color:#3f4a47;text-decoration:none;">loldata.cc</a> &middot; your games, your runes, your record.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
